# hostapd configuration for Evil Twin AP
# Interface to use for the AP (change to wlx98038eb494c2 if using external USB adapter)
interface=wlx98038eb494c2

# Driver interface type
driver=nl80211

# SSID to broadcast (modify this to match your target network)
ssid=SSU Aruba

# Operating channel (36 = 5GHz band)
channel=36

# Hardware mode (a = IEEE 802.11a/5GHz, b = IEEE 802.11b, g = IEEE 802.11g)
hw_mode=a

# Country code (US)
country_code=US

# IEEE 802.11n support
ieee80211n=1

# IEEE 802.11ac support (5GHz)
ieee80211ac=1

# Require HT (high throughput) capabilities
wmm_enabled=1

# Higher TX power
tx_queue_data3_aifs=7
tx_queue_data3_cwmin=15
tx_queue_data3_cwmax=1023
tx_queue_data3_burst=0

# WPA2 PSK configuration
# wpa=2
# wpa_key_mgmt=WPA-PSK
# wpa_passphrase=letitrain2
# rsn_pairwise=CCMP

# Access control
macaddr_acl=0

# Logging
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2

# Ignore broadcast SSID requests (0 = disabled, 1 = send empty SSID, 2 = clear SSID)
ignore_broadcast_ssid=0
