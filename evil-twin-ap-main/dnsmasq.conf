# dnsmasq configuration for Evil Twin AP
# Interface to listen on (change to wlx98038eb494c2 if using external USB adapter)
interface=wlx98038eb494c2

# Bind to the interface to ensure we don't serve to other interfaces
bind-interfaces

# Set the domain for DHCP clients
domain=local

# DHCP range configuration
# Subnet: 192.168.99.0/24
# Range: 192.168.99.10 - 192.168.99.250
# Lease time: 12 hours
dhcp-range=192.168.99.10,192.168.99.250,12h

# Gateway (this machine)
dhcp-option=3,192.168.99.1

# DNS server (this machine)
dhcp-option=6,192.168.99.1

# Set the DHCP server to authoritative mode
dhcp-authoritative

# Log DHCP requests
log-dhcp

# Log queries
log-queries

# Log to specific file
log-facility=/home/kabbali/Documents/Evil_Twin/evil-twin-ap-main/logs/dnsmasq.log

# Upstream DNS servers (Google DNS)
server=8.8.8.8
server=8.8.4.4

# DNS queries are forwarded normally to upstream servers
# Captive portal redirect is handled via iptables instead

# Disable reading /etc/resolv.conf
no-resolv

# Don't read /etc/hosts
no-hosts

# Cache size
cache-size=1000
